<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f3a5f" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
<meta name="description" content="Fotografe cupons fiscais e gere a planilha e o PDF da prestação de contas da viagem. Funciona offline, os dados ficam no seu aparelho." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Travelness" />
<title>Travelness · Prestação de contas</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<style>
/* Travelness — design tokens + components. Mobile-first. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --ink: #141a22;
  --ink-2: #4a5566;
  --muted: #7d889a;
  --line: #e3e8ef;
  --brand: #1f3a5f;
  --brand-ink: #ffffff;
  --accent: #2f7df6;
  --accent-soft: #e8f1ff;
  --ok: #0f9d6e;
  --ok-soft: #e4f6ef;
  --warn: #b26a00;
  --warn-soft: #fdf1dd;
  --danger: #c8372d;
  --danger-soft: #fdecea;
  --cat-alimentacao: #e8743b;
  --cat-combustivel: #7a5af8;
  --cat-transporte: #0f9d6e;
  --cat-estacionamento: #1f7a8c;
  --cat-outros: #7d889a;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(20, 26, 34, .06), 0 8px 24px rgba(20, 26, 34, .07);
  --shadow-sm: 0 1px 2px rgba(20, 26, 34, .08);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #171e27; --surface-2: #1d2630; --ink: #eef2f7; --ink-2: #b8c2d0;
    --muted: #8a94a3; --line: #28323e; --brand: #2a4c7d; --accent: #5c9bff; --accent-soft: #19283d;
    --ok-soft: #102b23; --warn-soft: #2d2415; --danger-soft: #301b19;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
h1, h2, h3 { margin: 0; line-height: 1.25; letter-spacing: -.015em; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---------- layout ---------- */
.app { max-width: 820px; margin: 0 auto; padding: 0 16px calc(132px + var(--safe-b)); }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
  padding: max(12px, env(safe-area-inset-top)) 16px 12px; margin: 0 -16px 16px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--line);
}
.topbar h1 { font-size: 19px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.iconbtn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; flex: 0 0 40px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.iconbtn:active { transform: scale(.95); }
.iconbtn.ghost { border-color: transparent; background: transparent; }

/* ---------- marca institucional ---------- */
.brandbar {
  display: flex; align-items: center;
  margin: 0 -16px;
  padding: max(10px, env(safe-area-inset-top)) 16px 9px;
  /* a marca é azul-escura: sobre o tema escuro ela sumiria, então a faixa
     é branca — é como a FGV aplica a marca sobre fundos escuros */
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.brandbar img { height: 20px; width: auto; display: block; }
@media (max-width: 360px) { .brandbar img { height: 17px; } }
/* com a faixa acima, a barra fixa não precisa repetir o recuo do notch */
.brandbar + .topbar { padding-top: 12px; }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-sm); padding: 16px; margin-bottom: 14px;
}
.card.tight { padding: 12px; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-head h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); flex: 1; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer;
  transition: transform .06s ease, background .15s ease;
  text-decoration: none; white-space: nowrap;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.dark { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); background: var(--danger-soft); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; font-size: 14px; padding: 0 14px; }
.btn-row { display: flex; gap: 10px; }
.btn-row > * { flex: 1; }

/* ---------- forms ---------- */
.field { margin-bottom: 14px; }
.field > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; letter-spacing: .01em; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 11px 13px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  background: var(--surface);
}
input[type="file"] { display: none; }
.row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (max-width: 420px) { .row.stack-sm { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; }
.check input { width: 22px; height: 22px; min-height: 0; accent-color: var(--accent); flex: 0 0 22px; }

/* segmented control para categoria */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
@media (min-width: 480px) { .seg { grid-template-columns: repeat(5, 1fr); } }
.seg button {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 4px;
  display: grid; gap: 4px; justify-items: center; font-size: 11.5px; font-weight: 600; color: var(--ink-2);
  cursor: pointer; min-height: 62px;
}
.seg button[aria-pressed="true"] { border-color: currentColor; background: var(--accent-soft); color: var(--accent); }
.seg button svg { width: 20px; height: 20px; }
.seg button span { line-height: 1.15; text-align: center; hyphens: auto; }

/* ---------- listas ---------- */
.list { display: flex; flex-direction: column; gap: 10px; }
.trip {
  display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow-sm);
}
.trip:active { transform: scale(.995); }
.trip h3 { font-size: 16.5px; }
.trip .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; font-size: 13px; color: var(--muted); }
.trip .amount { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }

.receipt {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 10px; cursor: pointer; width: 100%; text-align: left;
}
.receipt:active { background: var(--surface-2); }
.receipt .thumb {
  width: 56px; height: 56px; border-radius: 9px; object-fit: cover; background: var(--surface-2);
  border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted);
}
.receipt .title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.receipt .sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.receipt .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.day-head {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  margin: 16px 2px 8px; display: flex; justify-content: space-between;
}

/* ---------- chips, badges ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .02em; background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line); white-space: nowrap;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.alimentacao { color: var(--cat-alimentacao); border-color: color-mix(in srgb, var(--cat-alimentacao) 30%, var(--line)); background: color-mix(in srgb, var(--cat-alimentacao) 9%, var(--surface)); }
.chip.combustivel { color: var(--cat-combustivel); border-color: color-mix(in srgb, var(--cat-combustivel) 30%, var(--line)); background: color-mix(in srgb, var(--cat-combustivel) 9%, var(--surface)); }
.chip.transporte  { color: var(--cat-transporte);  border-color: color-mix(in srgb, var(--cat-transporte) 30%, var(--line));  background: color-mix(in srgb, var(--cat-transporte) 9%, var(--surface)); }
.chip.estacionamento { color: var(--cat-estacionamento); border-color: color-mix(in srgb, var(--cat-estacionamento) 30%, var(--line)); background: color-mix(in srgb, var(--cat-estacionamento) 9%, var(--surface)); }
.chip.outros      { color: var(--cat-outros); }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)); }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, var(--line)); }

/* ---------- totais ---------- */
.totals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .totals { grid-template-columns: repeat(5, 1fr); } }
.tot { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.tot .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.tot .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.grand {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 14px 16px; border-radius: var(--radius); background: var(--brand); color: var(--brand-ink);
  box-shadow: var(--shadow);
}
.grand .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.grand .k { font-size: 12.5px; opacity: .85; }

/* ---------- uploads em andamento ---------- */
.queue { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.qitem {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line));
  font-size: 13.5px;
}
.qitem.failed { background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 25%, var(--line)); }
.qitem.wait { background: var(--surface-2); border-color: var(--line); color: var(--muted); }
.spinner {
  width: 17px; height: 17px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--accent) 30%, transparent);
  border-top-color: var(--accent); animation: spin .7s linear infinite; flex: 0 0 17px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- barra de ação fixa ---------- */
.actionbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  padding: 10px 16px calc(10px + var(--safe-b));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(180%) blur(12px); border-top: 1px solid var(--line);
}
.actionbar .inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
.actionbar .inner > .btn { flex: 1; }
.fab-note { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 6px; }

/* ---------- sheet / modal ---------- */
.scrim {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 20, .5);
  display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease;
  backdrop-filter: blur(2px);
}
@media (min-width: 640px) { .scrim { align-items: center; padding: 24px; } }
.sheet {
  width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; background: var(--bg);
  border-radius: 22px 22px 0 0; padding: 8px 16px calc(24px + var(--safe-b));
  animation: up .22s cubic-bezier(.2, .8, .3, 1); box-shadow: var(--shadow);
}
@media (min-width: 640px) { .sheet { border-radius: 20px; max-height: 88vh; } }
.sheet-head {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
  padding: 10px 0 12px; margin-bottom: 4px; background: var(--bg);
}
.sheet-head h2 { font-size: 18px; flex: 1; }
.grabber { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 6px auto 2px; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }

.preview {
  width: 100%; max-height: 42vh; object-fit: contain; border-radius: 12px; background: var(--surface-2);
  border: 1px solid var(--line); margin-bottom: 14px; cursor: zoom-in;
}
.lightbox { position: fixed; inset: 0; z-index: 70; background: #000; display: grid; place-items: center; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

/* ---------- toast ---------- */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + var(--safe-b));
  z-index: 90; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 460px);
}
.toast {
  background: var(--ink); color: var(--bg); padding: 12px 14px; border-radius: 12px; font-size: 14px;
  box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: up .2s ease;
}
.toast.err { background: var(--danger); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }

/* ---------- vazio / carregando ---------- */
.empty { text-align: center; padding: 42px 20px; color: var(--muted); }
.empty svg { width: 46px; height: 46px; opacity: .45; margin-bottom: 12px; }
.empty h3 { font-size: 16px; color: var(--ink); margin-bottom: 6px; }
.skel { height: 72px; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%); background-size: 400% 100%; animation: sh 1.3s ease infinite; }
@keyframes sh { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.banner {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px;
  background: var(--warn-soft); color: var(--warn); font-size: 13.5px; margin-bottom: 14px;
  border: 1px solid color-mix(in srgb, var(--warn) 25%, var(--line));
}
.banner.info { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 22%, var(--line)); }
.banner button { background: none; border: none; font-weight: 700; color: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<div id="root">
  <div class="app">
    <div class="topbar"><div style="flex:1"><h1>Travelness<span class="sub">Prestação de contas de viagens</span></h1></div></div>
    <div class="empty"><h3>Abrindo…</h3><p>Carregando seus dados deste aparelho.</p></div>
  </div>
</div>
<noscript><p style="padding:24px;text-align:center">O Travelness precisa de JavaScript ativado.</p></noscript>
